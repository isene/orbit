[package]
name = "fe2o3-orbit"
version = "0.2.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "An almanac: sun, moon, planets, stars and eclipses. Where, when, how bright. Shared by the Fe₂O₃ apps (astro, tock, moon)."
license = "Unlicense"
repository = "https://github.com/isene/orbit"
keywords = ["astronomy", "ephemeris", "moon", "planets", "fe2o3"]
categories = ["science", "command-line-utilities"]

[lib]
name = "orbit"

[dependencies]
# Pinned: the ANSI helper used here landed in 0.1.43, so a publish must
# fail loudly until that version is on crates.io.
crust = { version = "0.1.43", path = "../crust", package = "fe2o3-crust" }

[profile.release]
opt-level = 3
lto = true
